<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KCTTW | Your Cart</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: #fff;
            font-family: "Montserrat", sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(255,255,255,.06),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(255,255,255,.05),
                    transparent 30%
                );
        }

        /* NAVBAR */

        .navbar {
            background: rgba(5,5,5,.85);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .navbar-brand {
            color: #fff !important;
            font-size: 23px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .brand-subtitle {
            display: block;
            font-size: 7px;
            letter-spacing: 2px;
            opacity: .45;
        }

        .nav-link {
            color: rgba(255,255,255,.65) !important;
            font-size: 12px;
            font-weight: 600;
        }

        .nav-link:hover {
            color: #fff !important;
        }

        .cart-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 21px;
            height: 21px;
            padding: 0 5px;
            margin-left: 4px;
            border-radius: 50%;
            background: #fff;
            color: #000;
            font-size: 9px;
            font-weight: 900;
        }

        /* PAGE */

        .cart-page {
            padding: 145px 0 100px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 55px;
        }

        .page-title span {
            display: block;
            margin-bottom: 12px;
            color: rgba(255,255,255,.45);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 4px;
        }

        .page-title h1 {
            margin: 0;
            font-size: clamp(42px, 7vw, 75px);
            font-weight: 900;
            letter-spacing: -3px;
        }

        .page-title p {
            margin-top: 15px;
            color: rgba(255,255,255,.5);
            font-size: 13px;
        }

        /* CART */

        .cart-box {
            padding: 25px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 25px;
            background: rgba(255,255,255,.045);
            backdrop-filter: blur(18px);
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-image {
            width: 120px;
            height: 120px;
            flex-shrink: 0;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,.06);
            overflow: hidden;
        }

        .cart-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 8px;
        }

        .cart-details {
            flex: 1;
        }

        .cart-details h3 {
            margin: 0 0 8px;
            font-size: 17px;
            font-weight: 800;
        }

        .cart-color {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 8px;
            color: rgba(255,255,255,.55);
            font-size: 11px;
        }

        .color-dot {
            width: 12px;
            height: 12px;
            display: inline-block;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.3);
        }

        .cart-price {
            font-size: 14px;
            font-weight: 800;
        }

        /* QUANTITY */

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }

        .quantity-control button {
            width: 30px;
            height: 30px;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 50%;
            background: rgba(255,255,255,.06);
            color: #fff;
            transition: .25s ease;
        }

        .quantity-control button:hover {
            background: #fff;
            color: #000;
        }

        .quantity-number {
            min-width: 20px;
            text-align: center;
            font-size: 12px;
            font-weight: 800;
        }

        /* ITEM TOTAL */

        .item-total {
            text-align: right;
            min-width: 110px;
        }

        .item-total strong {
            display: block;
            font-size: 16px;
            font-weight: 900;
        }

        .remove-btn {
            margin-top: 10px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,.35);
            font-size: 11px;
            transition: .25s ease;
        }

        .remove-btn:hover {
            color: #ff5b5b;
        }

        /* SUMMARY */

        .summary {
            position: sticky;
            top: 100px;
            padding: 28px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 25px;
            background: rgba(255,255,255,.045);
            backdrop-filter: blur(18px);
        }

        .summary h2 {
            margin-bottom: 25px;
            font-size: 20px;
            font-weight: 900;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 13px 0;
            color: rgba(255,255,255,.55);
            font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,.07);
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 20px;
            font-weight: 900;
        }

        .checkout-btn {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 50px;
            background: #fff;
            color: #000;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
            transition: .3s ease;
        }

        .checkout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255,255,255,.12);
        }

        .continue-btn {
            display: block;
            margin-top: 15px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 50px;
            color: #fff;
            text-align: center;
            text-decoration: none;
            font-size: 10px;
            font-weight: 800;
            transition: .3s ease;
        }

        .continue-btn:hover {
            background: rgba(255,255,255,.08);
            color: #fff;
        }

        /* EMPTY CART */

        .empty-cart {
            padding: 70px 20px;
            text-align: center;
        }

        .empty-cart i {
            font-size: 65px;
            opacity: .2;
        }

        .empty-cart h2 {
            margin-top: 20px;
            font-weight: 900;
        }

        .empty-cart p {
            color: rgba(255,255,255,.45);
            font-size: 13px;
        }

        .shop-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 25px;
            border-radius: 50px;
            background: #fff;
            color: #000;
            text-decoration: none;
            font-size: 10px;
            font-weight: 900;
        }

        /* MOBILE */

        @media (max-width: 767px) {

            .cart-page {
                padding-top: 120px;
            }

            .cart-box {
                padding: 15px;
            }

            .cart-item {
                align-items: flex-start;
                flex-wrap: wrap;
                gap: 15px;
            }

            .cart-image {
                width: 90px;
                height: 90px;
            }

            .cart-details {
                min-width: calc(100% - 110px);
            }

            .item-total {
                width: 100%;
                text-align: left;
                padding-left: 105px;
            }

            .summary {
                position: static;
                margin-top: 20px;
            }

        }

    </style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">

    <div class="container">

        <a class="navbar-brand" href="index.html">
            KCTTW

            <span class="brand-subtitle">
                KAMBA COLLECTION TO THE WORLD
            </span>
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="navbarNav"
        >

            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="products.html">
                        Products
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">
                        Contact
                    </a>
                </li>

                <li class="nav-item ms-lg-3">
                    <a class="nav-link" href="login.html">
                        Login
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- CART PAGE -->

<main class="cart-page">

    <div class="container">

        <div class="page-title">

            <span>
                KCTTW SHOPPING BAG
            </span>

            <h1>
                YOUR CART
            </h1>

            <p>
                Review your selected KCTTW pieces before checkout.
            </p>

        </div>


        <div id="cartContent"></div>

    </div>

</main>


<script>

    /* =====================================================
       GET CART
    ===================================================== */

    function getCart() {

        return JSON.parse(
            localStorage.getItem("kcttwCart")
        ) || [];

    }


    /* =====================================================
       SAVE CART
    ===================================================== */

    function saveCart(cart) {

        localStorage.setItem(
            "kcttwCart",
            JSON.stringify(cart)
        );

    }


    /* =====================================================
       FORMAT NAIRA
    ===================================================== */

    function formatNaira(amount) {

        return "₦" +
            Number(amount).toLocaleString(
                "en-NG"
            );

    }


    /* =====================================================
       COLOR CLASS
    ===================================================== */

    function getColorClass(color) {

        if (!color) return "black";

        return color
            .toLowerCase()
            .replace(/\s+/g, "-");

    }


    /* =====================================================
       UPDATE CART COUNT
    ===================================================== */

    function updateCartCount() {

        const cart = getCart();

        const count = cart.reduce(
            (total, item) =>
                total +
                Number(item.quantity || 1),
            0
        );

        const badge =
            document.getElementById(
                "navCartCount"
            );

        if (badge) {
            badge.textContent = count;
        }

    }


    /* =====================================================
       CHANGE QUANTITY
    ===================================================== */

    function changeQuantity(index, change) {

        const cart = getCart();

        if (!cart[index]) return;

        cart[index].quantity =
            Number(cart[index].quantity || 1) +
            change;

        if (cart[index].quantity <= 0) {

            cart.splice(index, 1);

        }

        saveCart(cart);

        renderCart();

    }


    /* =====================================================
       REMOVE ITEM
    ===================================================== */

    function removeItem(index) {

        const cart = getCart();

        if (!cart[index]) return;

        cart.splice(index, 1);

        saveCart(cart);

        renderCart();

    }


    /* =====================================================
       RENDER CART
    ===================================================== */

    function renderCart() {

        const cart = getCart();

        const container =
            document.getElementById(
                "cartContent"
            );


        updateCartCount();


        /* EMPTY */

        if (cart.length === 0) {

            container.innerHTML = `

                <div class="cart-box empty-cart">

                    <i class="bi bi-bag-x"></i>

                    <h2>
                        Your cart is empty
                    </h2>

                    <p>
                        You haven't added any KCTTW products yet.
                    </p>

                    <a
                        href="products.html"
                        class="shop-btn"
                    >
                        SHOP PRODUCTS
                    </a>

                </div>

            `;

            return;

        }


        let subtotal = 0;


        let itemsHTML = "";


        cart.forEach(
            function(item, index) {

                const quantity =
                    Number(item.quantity || 1);

                const price =
                    Number(item.price || 0);

                const itemTotal =
                    price * quantity;

                subtotal += itemTotal;


                const color =
                    item.color || "Black";


                const colorClass =
                    getColorClass(color);


                itemsHTML += `

                    <div class="cart-item">

                        <div class="cart-image">

                            <img
                                src="${item.image}"
                                alt="${item.name}"
                                onerror="
                                    this.style.display='none'
                                "
                            >

                        </div>


                        <div class="cart-details">

                            <h3>
                                ${item.name}
                            </h3>

                            <div class="cart-color">

                                <span
                                    class="color-dot ${colorClass}"
                                    style="
                                        background:${getColorBackground(color)};
                                    "
                                ></span>

                                Color:
                                <strong>
                                    ${color}
                                </strong>

                            </div>

                            <div class="cart-price">

                                ${formatNaira(price)}

                            </div>


                            <div class="quantity-control">

                                <button
                                    onclick="changeQuantity(
                                        ${index},
                                        -1
                                    )"
                                >
                                    −
                                </button>

                                <span class="quantity-number">
                                    ${quantity}
                                </span>

                                <button
                                    onclick="changeQuantity(
                                        ${index},
                                        1
                                    )"
                                >
                                    +
                                </button>

                            </div>

                        </div>


                        <div class="item-total">

                            <strong>
                                ${formatNaira(itemTotal)}
                            </strong>

                            <button
                                class="remove-btn"
                                onclick="removeItem(${index})"
                            >
                                <i class="bi bi-trash3"></i>
                                Remove
                            </button>

                        </div>

                    </div>

                `;

            }
        );


        container.innerHTML = `

            <div class="row g-4">

                <div class="col-lg-8">

                    <div class="cart-box">

                        ${itemsHTML}

                    </div>

                </div>


                <div class="col-lg-4">

                    <div class="summary">

                        <h2>
                            ORDER SUMMARY
                        </h2>

                        <div class="summary-row">

                            <span>
                                Items
                            </span>

                            <strong>
                                ${cart.reduce(
                                    (total, item) =>
                                        total +
                                        Number(item.quantity || 1),
                                    0
                                )}
                            </strong>

                        </div>


                        <div class="summary-row">

                            <span>
                                Subtotal
                            </span>

                            <strong>
                                ${formatNaira(subtotal)}
                            </strong>

                        </div>


                        <div class="summary-row">

                            <span>
                                Delivery
                            </span>

                            <strong>
                                Calculated at checkout
                            </strong>

                        </div>


                        <div class="summary-total">

                            <span>
                                Total
                            </span>

                            <span>
                                ${formatNaira(subtotal)}
                            </span>

                        </div>


                        <button
                            class="checkout-btn"
                            onclick="goToCheckout()"
                        >

                            PROCEED TO CHECKOUT

                            <i class="bi bi-arrow-right"></i>

                        </button>


                        <a
                            href="products.html"
                            class="continue-btn"
                        >

                            <i class="bi bi-arrow-left"></i>

                            CONTINUE SHOPPING

                        </a>

                    </div>

                </div>

            </div>

        `;

    }


    /* =====================================================
       COLOR BACKGROUND
    ===================================================== */

    function getColorBackground(color) {

        const colors = {

            Black: "#050505",

            White: "#ffffff",

            Red: "#c62828",

            Blue: "#1565c0",

            Green: "#168447",

            Yellow: "#f2c94c",

            Orange: "#ef7d20",

            Pink: "#e96c91",

            Purple: "#7b3fc6",

            Navy: "#15294a"

        };

        return colors[color] || "#888";

    }


    /* =====================================================
       CHECKOUT
    ===================================================== */

    function goToCheckout() {

        const cart = getCart();

        if (cart.length === 0) {

            alert(
                "Your cart is empty."
            );

            return;

        }

        window.location.href =
            "checkout.html";

    }


    /* =====================================================
       START
    ===================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        renderCart
    );

</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

</body>
</html>
